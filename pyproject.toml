[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcad-studio"
version = "0.1.0"
description = "Prompt-to-parametric-CAD studio with a validated CAD DSL and CadQuery/OpenSCAD backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "PromptCAD Studio contributors" }]
keywords = ["cad", "cadquery", "openscad", "ai", "fastapi", "parametric"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
cad = ["cadquery==2.8.0"]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]
desktop = [
  "pyinstaller>=6.10,<7",
]
# Generates app/models/generated from schemas/cad2 (scripts/gen_pydantic.py). Kept out of
# `cad`/`desktop` so scripts/desktop_lock.py (which compiles those) stays byte-stable.
schema = [
  "datamodel-code-generator==0.103.0",
]

[project.scripts]
promptcad = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web_dist/*", "web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["generated", "app/models/generated", "examples/generated", "build", "node_modules", "web", "src-tauri", ".venv-desktop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing findings in modules that ADR 0010 Phase 1 must not modify; remove these
# entries when app/services is next edited (all but SIM102 are auto-fixable).
"app/services/compiler.py" = ["UP032"]
"app/services/openscad.py" = ["I001"]
"app/services/planners/rule_based.py" = ["I001"]
"app/services/preview.py" = ["I001", "F401"]
