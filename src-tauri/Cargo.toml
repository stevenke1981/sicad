[package]
name = "promptcad-studio"
version = "0.1.0"
description = "PromptCAD Studio desktop shell (Tauri v2) hosting the Python geometry sidecar"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
promptcad-core = { path = "../crates/promptcad-core" }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Unix kill-on-close: `kill(-pgid, SIGKILL)` for the sidecar's process group (sidecar.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
