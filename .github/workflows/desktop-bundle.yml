name: desktop-bundle

# Builds the Windows NSIS installer with the frozen CadQuery sidecar (ADR 0010 Phase 1b),
# runs the frozen smoke gate against the built and the installed sidecar, and uploads the
# measurements + installer. No signing, no release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Desktop build venv (.venv-desktop with cadquery + PyInstaller)
        run: python scripts/desktop_env.py
      - name: npm ci (web)
        run: npm ci --prefix web
      - name: npm ci (Tauri CLI)
        run: npm ci
      - name: Freeze sidecar (onedir)
        run: .venv-desktop\Scripts\python.exe scripts\build_sidecar.py
      - name: Frozen smoke (built onedir)
        run: .venv-desktop\Scripts\python.exe scripts\frozen_smoke.py

      - name: Tauri build (NSIS)
        run: npm run tauri build
      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer produced" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "installer: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 1)) MiB)"
      - name: Silent install
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "promptcad-install"
          # NSIS: /D must be the last argument and unquoted.
          $p = Start-Process -FilePath "${{ steps.installer.outputs.path }}" -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          Get-ChildItem $dest
      - name: Frozen smoke + measurements (installed sidecar)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "promptcad-install"
          .venv-desktop\Scripts\python.exe scripts\frozen_smoke.py --measure `
            --exe "$dest\sidecar\promptcad-sidecar.exe" `
            --installer "${{ steps.installer.outputs.path }}" `
            --installed-dir "$dest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content build/sidecar/measurements.md >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidecar-measurements
          path: |
            build/sidecar/measurements.json
            build/sidecar/measurements.md
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: promptcad-studio-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
