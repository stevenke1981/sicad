name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,schema]"
      # The integration tests (tests/test_core_api.py) run the real promptcad-core. The
      # repo-root rust-toolchain.toml pins Windows MSVC, so select the runner's stable.
      - name: Use the host stable toolchain
        run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/promptcad-core
      - name: Build promptcad-core
        run: |
          cargo build --release --locked --bins --manifest-path crates/promptcad-core/Cargo.toml
          echo "PROMPTCAD_CORE_BIN=$GITHUB_WORKSPACE/crates/promptcad-core/target/release/promptcad-core" >> "$GITHUB_ENV"
      - run: ruff check .
      - name: JSON Schema is up to date with app/models (ADR 0008)
        run: python scripts/export_schema.py --check
      - name: Generated Pydantic models match schemas/cad2 (ADR 0008)
        run: python scripts/gen_pydantic.py --check
      - run: pytest --cov=app --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated TypeScript types match schemas/ (promptcad + cad2 core request/response)
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Production image: web stage (node:24-slim builds web/) + micromamba CadQuery runtime.
    # Asserts the image serves the React build at "/" (the 503 stub would mean web_dist
    # was not copied in).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag promptcad:ci .
      - name: Start container
        run: docker run --detach --name promptcad --publish 8000:8000 --env PROMPTCAD_ENV=production promptcad:ci
      - name: GET / returns the React index
        run: |
          deadline=$((SECONDS + 120))
          code=000
          until [ "$code" = 200 ] || [ "$SECONDS" -ge "$deadline" ]; do
            sleep 2
            code=$(curl --silent --output /tmp/index.html --write-out '%{http_code}' http://127.0.0.1:8000/ || true)
          done
          echo "GET / -> $code"
          test "$code" = 200
          grep -F 'id="root"' /tmp/index.html
      - name: API is up
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health
      - name: docker-compose healthcheck command works in the image
        run: >-
          docker exec promptcad /usr/local/bin/_entrypoint.sh python -c
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read(1)"
      - name: POST /api/v1/core works in the container (Rust core is baked in)
        run: |
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/core -H 'Content-Type: application/json' -d '{"op":"version"}' | tee /tmp/core.json
          python3 -c "import json; d = json.load(open('/tmp/core.json')); assert d['status'] == 'ok' and d['result']['op'] == 'version', d"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/capabilities | tee /tmp/caps.json
          python3 -c "import json; d = json.load(open('/tmp/caps.json')); assert d['core_available'] is True and d['core_schema_versions'] == ['1.0', '2.0'], d"
      - name: POST /api/v1/validate goes through the Rust core (issues carry a target)
        run: |
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/validate -H 'Content-Type: application/json' --data @examples/generated/plate-four-holes/spec.json | tee /tmp/validate.json
          python3 -c "import json; d = json.load(open('/tmp/validate.json')); assert d['issues'] and any(i.get('target') for i in d['issues']), d"
      - name: CadQuery imports in the runtime env
        run: docker exec promptcad /usr/local/bin/_entrypoint.sh python -c "import cadquery; print('cadquery', cadquery.__version__)"
      # The image's WORKDIR is /app (scripts/ is copied there), so no -w is needed.
      - name: Geometry equivalence (Cad2Compiler vs CadQuery 1.0 corpus, in the runtime env)
        run: docker exec promptcad /usr/local/bin/_entrypoint.sh python scripts/geometry_equivalence.py
      # The endpoint does not strip expected_resolved (a test-only key), so the caller removes it.
      - name: POST /api/v1/generate-from-document (2.0 plate yields model.step)
        run: |
          python3 -c "import json; d = json.load(open('examples/cad2/plate-four-holes.cad2.json', encoding='utf-8')); d.pop('expected_resolved', None); json.dump({'document': d, 'formats': ['step'], 'render': True}, open('/tmp/gen2-body.json', 'w', encoding='utf-8'))"
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/generate-from-document -H 'Content-Type: application/json' --data @/tmp/gen2-body.json | tee /tmp/gen2.json
          python3 -c "import json; d = json.load(open('/tmp/gen2.json', encoding='utf-8')); names = {a['filename'] for a in d.get('artifacts', [])}; assert d['status'] == 'completed', d; assert 'model.step' in names, sorted(names)"
      - name: Container logs
        if: always()
        run: docker logs promptcad || true

  lock-check:
    # requirements/desktop-*.txt (hashed, per platform) must still satisfy pyproject.toml:
    # recompiling with the committed pins as preferences must not change a byte (ADR 0011).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"  # pinned: desktop_lock.py --check diffs uv output
      - run: uv run --no-project --python 3.12 python scripts/desktop_lock.py --check

  desktop:
    # Tauri shell checks only, on all three bundle platforms; the full CadQuery bundle is
    # built by desktop-bundle.yml (manual / tags) because it takes minutes and ~450 MB.
    # build.rs drops an empty placeholder sidecar in debug builds, so no Python build is
    # needed here.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc (the Windows runner's default
      # host); other OSes override it before any rustup call.
      - name: Use the host stable toolchain (non-Windows)
        if: runner.os != 'Windows'
        run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Linux system packages (WebKitGTK for tauri/wry)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  core:
    # promptcad-core (ADR 0005, 0008): lint, tests, and the committed JSON Schemas under
    # schemas/cad2 must match what the Rust types generate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/promptcad-core
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml at the repo root pins the Windows MSVC host; use the Linux stable toolchain.
      - name: Use the host stable toolchain
        run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/promptcad-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Generated schemas under schemas/cad2 are up to date (ADR 0008)
        run: cargo run --quiet -- schema --out-dir ../../schemas/cad2 --check
