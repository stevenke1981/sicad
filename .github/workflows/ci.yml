name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: JSON Schema is up to date with app/models (ADR 0008)
        run: python scripts/export_schema.py --check
      - run: pytest --cov=app --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated TypeScript types match schemas/promptcad.schema.json
        run: |
          npm run gen:types
          git diff --exit-code -- src/api/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    # Tauri shell checks only; the full CadQuery bundle is built by desktop-bundle.yml
    # (manual / tags) because it takes minutes and ~550 MB. build.rs drops an empty
    # placeholder sidecar in debug builds, so no Python build is needed here.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc, the runner's default host.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
